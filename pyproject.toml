[tool.poetry]
name = "fencing-club"
version = "0.1.0"
description = ""
authors = ["Danil Stepanchuk <alykar90@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
alembic = "^1.18.4"
fastapi = "^0.136.1"
pydantic = "^2.13.3"
pytest = "^9.0.3"
lagom = "^2.7.7"
pydantic-settings = "^2.14.0"
asyncpg = "^0.31.0"
orjson = "^3.11.8"
sqlparams = "^6.2.0"
make = "^0.1.6.post2"
ruff = "^0.15.12"
mypy = "^1.20.2"
bcrypt = "^5.0.0"
jinja2 = "^3.1.6"
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
aiofiles = "^25.1.0"
uvicorn = "^0.49.0"


[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
safety = "^3.8.1"
psycopg2-binary = "^2.9.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert — контролируется вручную (bandit B101)
    "S104",  # bind all interfaces — допустимо для сервера
    "S106",  # hardcoded password funcarg — false positive для token_type
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/postgres/migrations/*" = ["E501", "E402"]
"src/infrastructure/postgres/repositories/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
