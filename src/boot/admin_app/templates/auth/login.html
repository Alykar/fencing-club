{% extends "base.html" %}
{% block title %}Вход — ULTRA Fencing Club{% endblock %}
{% block content %}

<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;">

  <!-- Emblem -->
  <div style="text-align:center;margin-bottom:40px;">
    <img src="/static/logo.svg" alt="ULTRA Fencing Club"
         style="width:96px;height:96px;border-radius:50%;margin:0 auto 20px;display:block;
                box-shadow:0 0 48px rgba(201,169,110,0.18);"/>
    <div style="color:#C9A96E;font-size:18px;font-weight:700;letter-spacing:0.28em;">ULTRA</div>
    <div style="color:#4A4540;font-size:9px;letter-spacing:0.2em;margin-top:4px;">FENCING CLUB</div>
  </div>

  <!-- Card -->
  <div style="width:100%;max-width:360px;">
    <div class="card card-accent" style="border-radius:20px;">
      <div style="padding:28px 28px 0;">
        <h1 style="color:#F5F1EC;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;">
          Вход
        </h1>
        <p style="color:#4A4540;font-size:11px;letter-spacing:0.06em;margin-bottom:24px;">
          Введите данные аккаунта
        </p>

        {% if error %}
        <div class="alert-error" style="margin-bottom:20px;">{{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/auth/login" class="space-y-4">
          <div>
            <label class="section-label" style="display:block;margin-bottom:8px;">Email</label>
            <input type="email" name="email" required autofocus class="input" placeholder="you@example.com"/>
          </div>
          <div>
            <label class="section-label" style="display:block;margin-bottom:8px;">Пароль</label>
            <input type="password" name="password" required class="input" placeholder="••••••••"/>
          </div>
          <div style="padding-top:4px;">
            <button type="submit" class="btn-primary" style="width:100%;text-align:center;padding:14px;">
              Войти
            </button>
          </div>
        </form>
      </div>

      <div style="padding:20px 28px 28px;margin-top:4px;">
        <div style="height:1px;background:rgba(255,255,255,0.05);margin-bottom:20px;"></div>
        <p style="text-align:center;font-size:11px;color:#4A4540;letter-spacing:0.06em;">
          Ещё не подавали заявку?
          <a href="/admin/auth/register" style="color:#1DB87E;font-weight:700;text-decoration:none;margin-left:4px;">
            Регистрация →
          </a>
        </p>
      </div>
    </div>
  </div>

</div>
{% endblock %}
