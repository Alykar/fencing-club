version: "3.9"

networks:
  internal:
    driver: bridge
    internal: true   # полностью изолированная сеть — наружу трафик не выходит
  external:
    driver: bridge   # только для публичного доступа к приложению

services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES__DB}
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    # НЕТ раздела ports — порт 5432 недоступен снаружи Docker-сети
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    env_file: .env.production
    environment:
      POSTGRES__HOST: db
    ports:
      - "127.0.0.1:8000:8000"   # слушаем только на localhost — Nginx/proxy берёт отсюда
    networks:
      - internal
      - external
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
